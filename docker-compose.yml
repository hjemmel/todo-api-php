volumes:
    logs:
        driver: local

services:
    # Long-running dev server: http://localhost:8080
    slim:
        build: .
        working_dir: /var/www
        command: php -S 0.0.0.0:8080 -t public
        env_file:
            - .env.development
        environment:
            docker: "true"
        ports:
            - 8080:8080
        volumes:
            - .:/var/www
            - logs:/var/www/logs

    # One-shot container for composer / phpunit:
    #   docker compose run --rm cli composer install
    #   docker compose run --rm cli composer test
    cli:
        build: .
        working_dir: /var/www
        env_file:
            - .env.development
        environment:
            docker: "true"
        volumes:
            - .:/var/www
        entrypoint: []
        command: ["php", "-v"]
